  - {name: Ars Technica, domains: [arstechnica.com]}
  - {name: Wired, domains: [wired.com]}
  - {name: The Verge, domains: [theverge.com]}
  - {name: ScienceDaily, domains: [sciencedaily.com], aggregator: true}
  - {name: Phys.org, domains: [phys.org, medicalxpress.com, techxplore.com], aggregator: true}
  - {name: EurekAlert!, domains: [eurekalert.org], aggregator: true}
