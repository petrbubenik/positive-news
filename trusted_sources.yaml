  - {name: New Scientist, domains: [newscientist.com]}
  - {name: Scientific American, domains: [scientificamerican.com]}
  - {name: Smithsonian, domains: [smithsonianmag.com], aliases: [Smithsonian Magazine]}
  - {name: National Geographic, domains: [nationalgeographic.com]}
  - {name: Live Science, domains: [livescience.com]}
  - {name: Popular Science, domains: [popsci.com]}
  - {name: Science News, domains: [sciencenews.org]}
  - {name: Physics World, domains: [physicsworld.com]}
  - {name: STAT News, domains: [statnews.com], aliases: [STAT]}
